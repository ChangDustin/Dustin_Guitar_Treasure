      </section>
      <section class="set-sec">
        <h3>備份與草稿</h3>
        <p class="hint">匯出目前看到的歌曲資料（JSON）。草稿裡還沒發布的檔案不會包含在 JSON 裡。</p>
        <div class="btn-row">
          <button class="btn sm" id="bk-export">${I('download')} 匯出 JSON</button>
          <label class="btn sm">${I('upload')} 匯入 JSON<input type="file" accept="application/json,.json" hidden id="bk-import"></label>
          <button class="btn sm danger" id="bk-discard" ${S.draft ? '' : 'disabled'}>${I('trash')} 捨棄所有未發布變更</button>
        </div>
      </section>`,
    foot: `<button class="btn" data-close>完成</button>`,
  });
  const el = m.el;
  $('#st-title', el).value = d.site.title || '';
  $('#st-sub', el).value = d.site.subtitle || '';
  $('#gh-owner', el).value = cfg.owner; $('#gh-repo', el).value = cfg.repo; $('#gh-branch', el).value = cfg.branch;
  $('#gh-token', el).value = cfg.token;
  if (focus === 'github') setTimeout(() => { $('#set-gh', el).scrollIntoView({ behavior: 'smooth' }); $('#gh-token', el).focus(); }, 120);

  $('#st-site', el).onclick = async () => {
    const t = $('#st-title', el).value.trim();
    if (!t) return toast('網站標題不能空白', 'err');
    const dr = ensureDraft();
    dr.data.site.title = t; dr.data.site.subtitle = $('#st-sub', el).value.trim();
    dr.log.push('修改網站資訊');
    await saveDraft(); render(); toast('網站資訊已存成草稿');
  };
  $('#st-pw', el).onclick = async () => {
    const a = $('#st-pw1', el).value, b = $('#st-pw2', el).value;
    if (a.length < 8) return toast('密碼至少要 8 個字', 'err');
    if (a !== b) return toast('兩次輸入的密碼不一樣', 'err');
    const dr = ensureDraft();
    dr.data.site.admin = await makeAdminHash(a);
    dr.log.push('修改管理密碼');
    await saveDraft();
    $('#st-pw1', el).value = $('#st-pw2', el).value = '';
    toast('新密碼已存成草稿，發布後生效');
  };
  const readCfg = () => ({ owner: $('#gh-owner', el).value.trim(), repo: $('#gh-repo', el).value.trim(), branch: $('#gh-branch', el).value.trim() || 'main', token: $('#gh-token', el).value.trim() });
  const ghMsg = $('#gh-msg', el);
  $('#gh-save', el).onclick = () => {
    const c = readCfg();
    store.set('gt-gh', { owner: c.owner, repo: c.repo, branch: c.branch });
    if (c.token) store.set('gt-gh-token', c.token); else store.del('gt-gh-token');
    ghMsg.textContent = '已儲存在這台裝置。';
    toast('GitHub 設定已儲存');
  };
  $('#gh-test', el).onclick = async () => {
    const c = readCfg();
    if (!c.owner || !c.repo || !c.token) { ghMsg.textContent = '請先填好 owner、repo 和 token。'; return; }
    ghMsg.textContent = '連線中…';
    try {
      const api = ghApi(c);
      const info = await api('');
      await api(`git/ref/heads/${encodeURIComponent(c.branch)}`);
      const canPush = info.permissions ? info.permissions.push : true;
      ghMsg.innerHTML = canPush
        ? `✅ 連線成功：<b>${esc(info.full_name)}</b>（${esc(c.branch)} 分支），可以發布。`
        : `⚠️ 讀得到 ${esc(info.full_name)}，但這個帳號沒有寫入權限。`;
    } catch (e) { ghMsg.textContent = `❌ ${e.message}：${ghHint(e)}`; }
  };
  $('#gh-clear', el).onclick = () => { store.del('gt-gh-token'); $('#gh-token', el).value = ''; ghMsg.textContent = 'token 已從這台裝置移除。'; };
  $('#bk-export', el).onclick = () => {
    const data = structuredClone(cur());
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = `guitar-treasure-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#bk-import', el).onchange = async e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const data = normalize(JSON.parse(await file.text()));
      if (!data.songs.length && !await confirmBox('這個備份裡沒有任何歌曲，確定要匯入嗎？')) return;
      const dr = ensureDraft();
      data.site.admin = data.site.admin || dr.data.site.admin;
      data.site.github = data.site.github || dr.data.site.github;
      dr.data = data;
      dr.log.push(`匯入備份（${data.songs.length} 首）`);
      gcDraftFiles();
      await saveDraft(); render();
      toast(`已匯入 ${data.songs.length} 首歌（草稿）`);
    } catch (err) { toast('匯入失敗：' + esc(err.message), 'err'); }
  };
  $('#bk-discard', el).onclick = async () => {
    if (!await confirmBox('確定要捨棄所有還沒發布的變更嗎？這個動作無法復原。', { ok: '捨棄', danger: true })) return;
    m.close(); await discardDraft(); toast('已捨棄草稿，回到網站上的版本');
  };
}

/* =========================================================
   管理者：發布列與發布到 GitHub
   ========================================================= */
function renderPubBar() {
  const bar = $('#pubbar');
  if (!S.admin || !S.draft || S.pubbarHidden) { bar.hidden = true; return; }
  bar.hidden = false;
  if (S.draft.publishedRev) {
    bar.innerHTML = `<span class="dot ok"></span><span class="txt">已發布！GitHub Pages 大約 1 分鐘後更新</span><button class="btn sm ghost" id="pb-ok">知道了</button>`;
    $('#pb-ok').onclick = () => { S.pubbarHidden = true; renderPubBar(); };
    return;
  }
  const n = S.draft.log.length;
  const stale = S.pub.rev && S.draft.baseRev && S.pub.rev > S.draft.baseRev;
  bar.innerHTML = `<span class="dot"></span><span class="txt"><b>${n}</b> 項變更還沒發布${stale ? '（⚠️ 網站在別處更新過）' : ''}</span>
    <button class="btn sm ghost" id="pb-log">查看</button>
    <button class="btn sm ghost" id="pb-discard">捨棄</button>
    <button class="btn sm accent" id="pb-pub">${I('cloud')} 發布到網站</button>`;
  $('#pb-log').onclick = () => modal({ title: '還沒發布的變更', body: `<ol class="loglist">${S.draft.log.map(l => `<li>${esc(l)}</li>`).join('')}</ol>`, foot: '<button class="btn" data-close>關閉</button>' });
  $('#pb-discard').onclick = async () => {
    if (await confirmBox('確定要捨棄這些還沒發布的變更嗎？', { ok: '捨棄', danger: true })) { await discardDraft(); toast('已捨棄草稿'); }
  };
  $('#pb-pub').onclick = publish;
}

let publishing = false;
async function publish() {
  if (publishing || !S.draft) return;
  const cfg = ghConfig();
  if (!cfg.token || !cfg.owner || !cfg.repo) {
    toast('第一次發布前，請先在「網站設定」填好 GitHub token', 'warn', 4500);
    return openSettings('github');
  }
  publishing = true;
  const dr = S.draft;
  const data = structuredClone(dr.data);
  data.rev = new Date().toISOString();
  data.site.github = { owner: cfg.owner, repo: cfg.repo, branch: cfg.branch };
  const used = collectPaths(data);
  const uploads = Object.entries(dr.files).filter(([p]) => used.has(p));
  const steps = ['連線 GitHub，讀取最新版本', `上傳檔案（${uploads.length} 個）`, '建立 commit', '更新網站分支'];
  const m = modal({
    title: '發布到網站', dismissible: false,
    body: `<ol class="steps">${steps.map(t => `<li><span class="sdot"></span><span>${t}</span><em></em></li>`).join('')}</ol>
      <div class="pbar"><i id="pbar"></i></div><div id="presult"></div>`,
    foot: `<button class="btn" id="p-close" disabled>關閉</button>`,
  });
  const lis = $$('.steps li', m.el), bar = $('#pbar', m.el), closeBtn = $('#p-close', m.el);
  closeBtn.onclick = () => m.close();
  let at = -1;
  const step = i => { if (at >= 0) lis[at].className = 'done'; at = i; lis[i].className = 'run'; bar.style.width = (i / steps.length * 100) + '%'; };
  try {
    const api = ghApi(cfg);
    step(0);
    const ref = await api(`git/ref/heads/${encodeURIComponent(cfg.branch)}`);
    const baseCommit = await api(`git/commits/${ref.object.sha}`);
    const baseTree = await api(`git/trees/${baseCommit.tree.sha}?recursive=1`);
    const existing = new Set(baseTree.tree.filter(t => t.type === 'blob').map(t => t.path));

    step(1);
    const tree = [];
    let k = 0;
    for (const [path, blob] of uploads) {
      const b = await api('git/blobs', { method: 'POST', body: { content: await toBase64(blob), encoding: 'base64' } });
      tree.push({ path, mode: '100644', type: 'blob', sha: b.sha });
      k++;
      lis[1].querySelector('em').textContent = `${k}/${uploads.length}`;
      bar.style.width = ((1 + k / Math.max(1, uploads.length)) / steps.length * 100) + '%';
    }
    tree.push({ path: 'data/songs.json', mode: '100644', type: 'blob', content: JSON.stringify(data, null, 2) + '\n' });
    const removed = [...existing].filter(p => MANAGED.test(p) && !used.has(p));
    for (const p of removed) tree.push({ path: p, mode: '100644', type: 'blob', sha: null });

    step(2);
    const newTree = await api('git/trees', { method: 'POST', body: { base_tree: baseCommit.tree.sha, tree } });
    const log = dr.log.length ? dr.log : ['更新資料'];
    const message = `網站更新：${log.slice(0, 4).join('、')}${log.length > 4 ? ` 等 ${log.length} 項` : ''}\n\n透過「小齊的吉他寶庫」管理介面發布`;
    const commit = await api('git/commits', { method: 'POST', body: { message, tree: newTree.sha, parents: [ref.object.sha] } });

    step(3);
    await api(`git/refs/heads/${encodeURIComponent(cfg.branch)}`, { method: 'PATCH', body: { sha: commit.sha } });
    lis[3].className = 'done'; bar.style.width = '100%';

    dr.data = data; dr.publishedRev = data.rev; dr.log = [];
    await saveDraft();
    $('#presult', m.el).innerHTML = `<div class="result-box ok">✅ <b>發布成功！</b>共 ${uploads.length} 個檔案${removed.length ? `、清掉 ${removed.length} 個不用的舊檔` : ''}。<br>
      GitHub Pages 通常 1 分鐘內會更新，屆時所有人都看得到。<br>
      <a href="https://github.com/${esc(cfg.owner)}/${esc(cfg.repo)}/commit/${commit.sha}" target="_blank" rel="noopener">在 GitHub 查看這次的 commit ↗</a></div>`;
    renderPubBar();
  } catch (e) {
    if (at >= 0) lis[at].className = 'fail';
    $('#presult', m.el).innerHTML = `<div class="result-box bad">❌ <b>發布失敗</b>（${esc(e.message)}）<br>${ghHint(e)}<br><span class="hint">草稿還在，修正後可以再按一次發布。</span></div>`;
  } finally {
    publishing = false;
    closeBtn.disabled = false;
    closeBtn.classList.add('primary');
  }
}

/* =========================================================
   啟動
   ========================================================= */
async function boot() {
  const theme = store.get('gt-theme', null);
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  S.admin = sess.get('gt-admin', false) === true;
  renderTop();
  try {
    const r = await fetch('data/songs.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    S.pub = normalize(await r.json());
  } catch (e) {
    app.innerHTML = `<div class="wrap"><div class="panel load-err"><h2>歌曲資料載入失敗</h2>
      <p>如果你是直接雙擊打開 <code>index.html</code>，瀏覽器會擋住讀取 <code>data/songs.json</code>。請改用 GitHub Pages 網址，或在資料夾裡執行 <code>python -m http.server</code> 再打開 <code>http://localhost:8000</code>。</p>
      <p class="hint">錯誤訊息：${esc(e.message)}</p></div></div>`;
    return;
  }
  const saved = await idb.get('draft');
  if (saved && saved.data) {
    if (saved.publishedRev && S.pub.rev && S.pub.rev >= saved.publishedRev) await idb.del('draft');
    else { saved.data = normalize(saved.data); saved.files = saved.files || {}; saved.log = saved.log || []; S.draft = saved; }
  }
  render();
}
boot();
})();
</script>
